@if (hasCatalogs()) {
  <div class="border-t border-neutral-200">
    <div class="flex items-start gap-3 px-4 py-2">
      <div class="min-w-0 flex-1 space-y-2">
        @if (allergenCatalog().length > 0) {
          <div>
            <p class="mb-1 text-[11px] font-semibold uppercase tracking-wide text-neutral-400">Sin alérgenos</p>
            <div
              class="flex flex-nowrap gap-2 overflow-x-auto pb-0.5 [-ms-overflow-style:none] [scrollbar-width:none] [&::-webkit-scrollbar]:hidden"
              role="group"
              aria-label="Excluir alérgenos"
            >
              @for (allergen of allergenCatalog(); track allergen.id) {
                <button
                  type="button"
                  class="inline-flex min-h-11 shrink-0 items-center gap-1.5 rounded-full px-3 text-xs font-medium ring-1 transition-colors"
                  [class.bg-neutral-100]="!isAllergenActive(allergen.id)"
                  [class.text-neutral-700]="!isAllergenActive(allergen.id)"
                  [class.ring-neutral-200]="!isAllergenActive(allergen.id)"
                  [class.bg-amber-100]="isAllergenActive(allergen.id)"
                  [class.text-amber-950]="isAllergenActive(allergen.id)"
                  [class.ring-amber-300]="isAllergenActive(allergen.id)"
                  [attr.aria-pressed]="isAllergenActive(allergen.id)"
                  (click)="toggleAllergen(allergen.id)"
                >
                  @if (allergen.iconUrl) {
                    <img
                      [ngSrc]="allergen.iconUrl"
                      width="16"
                      height="16"
                      alt=""
                      class="h-4 w-4"
                    />
                  }
                  <span class="whitespace-nowrap">Sin {{ tagName(allergen) }}</span>
                </button>
              }
            </div>
          </div>
        }

        @if (dietaryTagCatalog().length > 0) {
          <div>
            <p class="mb-1 text-[11px] font-semibold uppercase tracking-wide text-neutral-400">Preferencias</p>
            <div
              class="flex flex-nowrap gap-2 overflow-x-auto pb-0.5 [-ms-overflow-style:none] [scrollbar-width:none] [&::-webkit-scrollbar]:hidden"
              role="group"
              aria-label="Preferencias dietéticas"
            >
              @for (tag of dietaryTagCatalog(); track tag.id) {
                <button
                  type="button"
                  class="inline-flex min-h-11 shrink-0 items-center gap-1.5 rounded-full px-3 text-xs font-medium ring-1 transition-colors"
                  [class.bg-neutral-100]="!isDietaryActive(tag.id)"
                  [class.text-neutral-700]="!isDietaryActive(tag.id)"
                  [class.ring-neutral-200]="!isDietaryActive(tag.id)"
                  [class.bg-emerald-100]="isDietaryActive(tag.id)"
                  [class.text-emerald-950]="isDietaryActive(tag.id)"
                  [class.ring-emerald-300]="isDietaryActive(tag.id)"
                  [attr.aria-pressed]="isDietaryActive(tag.id)"
                  (click)="toggleDietary(tag.id)"
                >
                  @if (tag.iconUrl) {
                    <img [ngSrc]="tag.iconUrl" width="16" height="16" alt="" class="h-4 w-4" />
                  }
                  <span class="whitespace-nowrap">{{ tagName(tag) }}</span>
                </button>
              }
            </div>
          </div>
        }
      </div>

      @if (hasActiveFilters()) {
        <button
          type="button"
          class="shrink-0 self-center rounded-full px-2 py-2 text-xs font-semibold text-neutral-500 underline-offset-2 hover:text-neutral-800 hover:underline"
          (click)="clearFilters()"
        >
          Limpiar
        </button>
      }
    </div>
  </div>
}
